<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Audio Tour - Thuyết Minh Tự Động SGU</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(26, 34, 53, 0.85);
            --primary: #38bdf8;
            --accent: #10b981;
            --danger: #ef4444;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border: rgba(255, 255, 255, 0.12);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: var(--bg-color);
            background-image: radial-gradient(circle at 50% 0%, rgba(56, 189, 248, 0.18), transparent 60%);
            color: var(--text-main);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px 16px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: #34d399;
            border: 1px solid rgba(16, 185, 129, 0.4);
            padding: 6px 12px;
            border-radius: 999px;
            font-size: 0.8rem;
            font-weight: 700;
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #10b981;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(16, 185, 129, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); }
        }

        .device-badge {
            font-size: 0.8rem;
            color: var(--text-muted);
            background: rgba(255, 255, 255, 0.06);
            padding: 6px 12px;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .main-card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(20px);
            text-align: center;
            margin-bottom: 20px;
        }

        .location-img {
            width: 100%;
            height: 200px;
            border-radius: 16px;
            object-fit: cover;
            margin-bottom: 16px;
            border: 1px solid var(--border);
        }

        .location-title {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 6px;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .location-address {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 18px;
        }

        /* Language Toggle: wrap vì danh sách ngôn ngữ nạp động, có thể lên tới 25 */
        .lang-toggle {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 4px;
            max-width: 100%;
            background: rgba(15, 23, 42, 0.8);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 4px;
            margin-bottom: 20px;
        }

        .lang-btn {
            background: transparent;
            color: var(--text-muted);
            border: none;
            padding: 7px 13px;
            font-size: 0.85rem;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
        }

        .lang-btn.active {
            background: var(--primary);
            color: #0b1120;
            font-weight: 700;
        }

        /* Audio controls */
        .audio-container {
            margin-bottom: 20px;
        }

        audio {
            width: 100%;
            height: 48px;
            border-radius: 24px;
            outline: none;
        }

        .narration-box {
            background: rgba(15, 23, 42, 0.6);
            border-left: 3px solid var(--primary);
            padding: 14px 16px;
            border-radius: 0 12px 12px 0;
            font-size: 0.9rem;
            line-height: 1.55;
            color: #cbd5e1;
            text-align: left;
            max-height: 130px;
            overflow-y: auto;
            margin-bottom: 20px;
        }

        .script-note {
            display: block;
            margin-top: 8px;
            font-size: 0.78rem;
            color: #fbbf24;
        }

        .status-note {
            margin-top: 8px;
            font-size: 0.8rem;
            color: #fbbf24;
            text-align: left;
        }

        .btn-exit {
            width: 100%;
            background: rgba(239, 68, 68, 0.15);
            color: #f87171;
            border: 1px solid rgba(239, 68, 68, 0.35);
            padding: 14px;
            border-radius: 14px;
            font-size: 0.95rem;
            font-weight: 700;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            transition: all 0.2s;
        }

        .btn-exit:hover {
            background: rgba(239, 68, 68, 0.25);
        }

        .footer {
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-muted);
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="header">
        <div class="live-indicator">
            <div class="pulse-dot"></div>
            <span>ĐANG KẾT NỐI LIVE</span>
        </div>
        <div class="device-badge" id="deviceLabel">Thiết bị: Đang khởi tạo...</div>
    </div>

    <div class="main-card">
        <img id="poiImage" src="https://images.unsplash.com/photo-1583417319070-4a69db38a482?w=600" alt="Di tích" class="location-img">
        <h2 class="location-title" id="poiTitle">Dinh Độc Lập</h2>
        <p class="location-address" id="poiAddress">135 Nam Kỳ Khởi Nghĩa, Bến Thành, Quận 1, TP.HCM</p>

        <!-- Nút chuyển ngôn ngữ: nạp động từ /api/languages -->
        <div class="lang-toggle" id="langToggle"></div>

        <!-- Trình phát âm thanh HTML5 -->
        <div class="audio-container">
            <audio id="audioPlayer" controls autoplay></audio>
            <div id="audioStatus" class="status-note"></div>
        </div>

        <!-- Kịch bản thuyết minh -->
        <div class="narration-box">
            <div id="scriptText">Đang tải kịch bản thuyết minh...</div>
            <small id="scriptNote" class="script-note"></small>
        </div>

        <!-- Nút Thoát / Rời đi -->
        <button class="btn-exit" onclick="leaveSession()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            Dừng Nghe & Thoát Khỏi Phiên (Out)
        </button>
    </div>

    <div class="footer">
        Đồ án Công nghệ Phần mềm - Trường Đại học Sài Gòn (SGU)
    </div>

    <script>
        // 1. Lấy tham số URL
        const urlParams = new URLSearchParams(window.location.search);
        const mockId = urlParams.get("mockId");

        // Khởi tạo mã thiết bị duy nhất
        let deviceId = mockId || localStorage.getItem("audiotour_device_id");
        if (!deviceId) {
            const randomNum = Math.floor(1000 + Math.random() * 9000);
            const userAgent = navigator.userAgent;
            let deviceName = "Thiết bị di động";
            if (/iPhone|iPad/i.test(userAgent)) deviceName = "iPhone";
            else if (/Android/i.test(userAgent)) deviceName = "Android";
            deviceId = `${deviceName}-${randomNum}`;
            localStorage.setItem("audiotour_device_id", deviceId);
        }
        document.getElementById("deviceLabel").innerText = deviceId;

        const locationIdParam = urlParams.get("locationId");
        let currentLocationId = locationIdParam ? parseInt(locationIdParam) : null;
        let currentLang = urlParams.get("lang") || "vi";
        const qrCodeParam = urlParams.get("qr");
        // Cách khách đến được POI này, ghi vào playback log
        const triggerParam = urlParams.get("trigger");
        const triggerType = ["QR_CODE", "MANUAL", "GEOFENCE"].includes(triggerParam)
            ? triggerParam
            : (qrCodeParam ? "QR_CODE" : "MANUAL");

        // Không có locationId lẫn mã QR: về trang chọn, không phát nhầm POI mặc định
        if (!currentLocationId && !qrCodeParam) {
            window.location.replace("index.html");
        }

        let listenSeconds = 0;
        let isLeft = false;
        let narrationSeq = 0; // tăng mỗi lần tải kịch bản, chặn race khi đổi ngôn ngữ nhanh
        // Chỉ khi đã xác định được POI mới được ghi nhận phiên nghe (tránh ghi nhầm POI mặc định)
        let sessionValid = !qrCodeParam && Boolean(currentLocationId);
        let locationResolved = false;

        const player = document.getElementById("audioPlayer");
        const scriptText = document.getElementById("scriptText");
        const scriptNote = document.getElementById("scriptNote");
        const audioStatus = document.getElementById("audioStatus");
        // Fallback trung tính khi API lỗi - không dùng lại nội dung của POI khác
        const DEFAULT_SCRIPT_TEXT = "Chưa tải được bản thuyết minh của điểm tham quan này. Bạn vẫn có thể nghe âm thanh khi mạng ổn.";
        // Giữ 2 ngôn ngữ gốc khi không gọi được /api/languages
        const FALLBACK_LANGUAGES = [
            { code: "vi", name: "Tiếng Việt" },
            { code: "en", name: "English" }
        ];

        // Đếm giây thực tế đang phát
        player.addEventListener("timeupdate", () => {
            listenSeconds = Math.round(player.currentTime);
        });

        // Lỗi phát âm thanh (hết file, mạng lỗi...) -> báo trung tính, không đoán nguyên nhân
        player.addEventListener("error", () => {
            if (!player.error || player.error.code === MediaError.MEDIA_ERR_ABORTED) return; // đổi nguồn audio
            audioStatus.textContent = "Không phát được âm thanh cho ngôn ngữ này. Bạn vẫn có thể đọc kịch bản bên dưới.";
        });

        // 3. Tải thông tin địa điểm theo QR hoặc ID
        async function initLocation() {
            if (!currentLocationId && !qrCodeParam) return;
            await loadLanguages();
            try {
                let url = `/api/locations/${currentLocationId}`;
                if (qrCodeParam) {
                    url = `/api/locations/by-qr/${encodeURIComponent(qrCodeParam)}`;
                }
                const res = await fetch(url);
                if (res.ok) {
                    const data = await res.json();
                    if (data && data.id) {
                        currentLocationId = data.id;
                        document.getElementById("poiTitle").innerText = data.name;
                        document.getElementById("poiAddress").innerText = data.address || "";
                        if (data.imageUrl) document.getElementById("poiImage").src = data.imageUrl;
                        locationResolved = true;
                        sessionValid = true;
                    }
                }
            } catch (e) {
                console.log("Dùng thông tin mặc định");
            }

            // QR không resolve được địa điểm -> không được lấy nhầm POI mặc định (locationId 4)
            if (qrCodeParam && !locationResolved) {
                showQrNotFound();
                return;
            }

            // Cập nhật audio stream
            loadAudioStream();

            // Lấy kịch bản thuyết minh thật từ API
            loadNarrationText();

            // Gửi tín hiệu JOIN
            sendHeartbeat("JOIN");
        }

        // Mã QR không hợp lệ -> báo rõ và cho quay lại trang chủ, không phát nhầm POI khác
        function showQrNotFound() {
            document.getElementById("poiTitle").innerText = "Không tìm thấy địa điểm";
            document.getElementById("poiAddress").innerText = "";
            player.removeAttribute("src");
            audioStatus.textContent = "";
            scriptText.textContent = "Không tìm thấy địa điểm theo mã QR này.";
            scriptNote.innerHTML = '<a href="index.html" style="color:#38bdf8;">← Quay lại trang chủ</a>';
            // Không có phiên hợp lệ -> không gửi heartbeat cho POI mặc định
            clearInterval(heartbeatInterval);
        }

        function loadAudioStream() {
            audioStatus.textContent = "";
            player.src = `/api/packages/stream?locationId=${currentLocationId}&languageCode=${currentLang}`;
            player.play().catch(e => console.log("Cần bấm Play trên di động"));
        }

        // 3. Lấy kịch bản thuyết minh thật theo POI + ngôn ngữ đang chọn
        async function loadNarrationText() {
            const seq = ++narrationSeq;
            try {
                const res = await fetch(`/api/narrations?locationId=${currentLocationId}&languageCode=${currentLang}`);
                if (seq !== narrationSeq) return; // đã có request mới hơn -> bỏ kết quả cũ
                if (res.ok) {
                    const data = await res.json();
                    if (seq !== narrationSeq) return; // đã có request mới hơn -> bỏ kết quả cũ
                    scriptText.textContent = (data && data.textContent)
                        ? data.textContent
                        : "Chưa có nội dung thuyết minh cho điểm tham quan này.";
                    scriptNote.textContent = "";
                    return;
                }
                if (res.status === 404) {
                    scriptText.textContent = "Chưa có bản thuyết minh cho ngôn ngữ này tại điểm tham quan này. Hãy chọn ngôn ngữ khác.";
                    scriptNote.textContent = "";
                    return;
                }
                throw new Error(`HTTP ${res.status}`);
            } catch (e) {
                if (seq !== narrationSeq) return; // đã có request mới hơn -> bỏ kết quả cũ
                scriptText.textContent = DEFAULT_SCRIPT_TEXT;
                scriptNote.textContent = "Không tải được kịch bản từ máy chủ, đang hiển thị nội dung dự phòng.";
                console.log("Lỗi tải kịch bản thuyết minh:", e);
            }
        }

        function setLanguage(lang) {
            currentLang = lang;
            listenSeconds = 0; // reset để heartbeat không gửi thời gian nghe của bản thu âm cũ
            syncLanguageButtons();
            loadAudioStream();
            loadNarrationText();
            sendHeartbeat("PING");
        }

        // Nút ngôn ngữ nạp động: admin thêm ngôn ngữ trên dashboard thì player tự có, không cần sửa code
        async function loadLanguages() {
            let languages = FALLBACK_LANGUAGES;
            try {
                const res = await fetch("/api/languages");
                if (res.ok) {
                    const data = await res.json();
                    if (Array.isArray(data) && data.length) languages = data;
                }
            } catch (e) {
                console.warn("Không tải được danh sách ngôn ngữ, dùng mặc định:", e);
            }
            const toggle = document.getElementById("langToggle");
            toggle.innerHTML = "";
            languages.forEach(language => {
                const button = document.createElement("button");
                button.className = "lang-btn";
                button.dataset.lang = language.code;
                button.textContent = language.name;
                button.addEventListener("click", () => setLanguage(language.code));
                toggle.appendChild(button);
            });
            // ?lang= trỏ tới ngôn ngữ đã bị xóa -> rơi về ngôn ngữ đầu danh sách
            if (!languages.some(language => language.code === currentLang)) {
                currentLang = languages[0].code;
            }
            syncLanguageButtons();
        }

        // Đồng bộ nút ngôn ngữ với currentLang (gọi lúc init vì ?lang= có thể mở bằng 'en')
        function syncLanguageButtons() {
            document.querySelectorAll("#langToggle .lang-btn").forEach(button => {
                button.classList.toggle("active", button.dataset.lang === currentLang);
            });
        }

        // 4. Cơ chế gửi Heartbeat định kỳ mỗi 3 giây
        async function sendHeartbeat(action = "PING") {
            if (isLeft || !sessionValid || !locationResolved) return;
            const payload = {
                deviceId: deviceId,
                locationId: currentLocationId,
                languageCode: currentLang,
                action: action,
                listenDurationSeconds: listenSeconds,
                triggerType: triggerType
            };

            try {
                await fetch("/api/analytics/heartbeat", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload),
                    keepalive: true
                });
            } catch (err) {
                console.error("Lỗi heartbeat:", err);
            }
        }

        // Chu kỳ gửi Heartbeat mỗi 3 giây
        const heartbeatInterval = setInterval(() => {
            sendHeartbeat("PING");
        }, 3000);

        // 5. Khi người dùng bấm nút Thoát / Dừng
        function leaveSession() {
            isLeft = true;
            clearInterval(heartbeatInterval);
            player.pause();

            // Gửi tín hiệu LEAVE
            const payload = JSON.stringify({
                deviceId: deviceId,
                locationId: currentLocationId,
                languageCode: currentLang,
                action: "LEAVE",
                listenDurationSeconds: listenSeconds,
                triggerType: triggerType
            });

            if (sessionValid) {
                if (navigator.sendBeacon) {
                    navigator.sendBeacon("/api/analytics/heartbeat", new Blob([payload], { type: "application/json" }));
                } else {
                    fetch("/api/analytics/heartbeat", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: payload,
                        keepalive: true
                    });
                }
            }

            // Trở về giao diện người dùng ngay, giữ toà nếu khách vào từ QR
            const venue = urlParams.get("venue");
            window.location.href = "index.html" + (venue ? "?venue=" + encodeURIComponent(venue) : "");
        }

        // 6. Tự động gửi LEAVE khi đóng tab / tắt trình duyệt
        window.addEventListener("beforeunload", () => {
            if (!isLeft && sessionValid) {
                const payload = JSON.stringify({
                    deviceId: deviceId,
                    locationId: currentLocationId,
                    languageCode: currentLang,
                    action: "LEAVE",
                    listenDurationSeconds: listenSeconds,
                    triggerType: triggerType
                });
                if (navigator.sendBeacon) {
                    navigator.sendBeacon("/api/analytics/heartbeat", new Blob([payload], { type: "application/json" }));
                }
            }
        });

        // Bắt đầu
        initLocation();
    </script>
</body>
</html>
