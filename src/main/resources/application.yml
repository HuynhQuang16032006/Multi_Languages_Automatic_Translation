server:
  port: 8080

spring:
  application:
    name: audiotour

  datasource:
    url: jdbc:mysql://localhost:3306/audiotour_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # DB cũ đã có bảng do Hibernate tạo: baseline ở version 0 để V1 vẫn được chạy (no-op nhờ IF NOT EXISTS)
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

jwt:
  # Secret dùng ký JWT (HS256 cần tối thiểu 32 byte) - đổi bằng env JWT_SECRET khi production
  secret: ${JWT_SECRET:dev-secret-key-change-me-in-production-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}

