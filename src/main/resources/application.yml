server:
  port: 8080
  forward-headers-strategy: none

spring:
  application:
    name: audiotour

  datasource:
    url: jdbc:mysql://localhost:3306/audiotour_db?useSSL=false&allowPublicKeyRetrieval=true&characterEncoding=UTF-8&serverTimezone=UTC
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    # DB cũ đã có bảng do Hibernate tạo: baseline ở version 0 để V1 vẫn được chạy (no-op nhờ IF NOT EXISTS)
    baseline-on-migrate: true
    baseline-version: 0

management:
  endpoints:
    web:
      exposure:
        include: health,metrics,info

jwt:
  # Secret dùng ký JWT (HS256 cần tối thiểu 32 byte) - đổi bằng env JWT_SECRET khi production
  secret: ${JWT_SECRET:dev-secret-key-change-me-in-production-0123456789abcdef}
  expiration-ms: ${JWT_EXPIRATION_MS:86400000}

app:
  admin:
    username: ${APP_ADMIN_USERNAME:admin}
    password: ${APP_ADMIN_PASSWORD:admin123}
  tts:
    # ElevenLabs: free tier 10.000 ký tự/tháng. Lấy key tại https://elevenlabs.io/app/settings/api-keys
    # Để trống thì app vẫn khởi động, endpoint sinh audio trả 503.
    api-key: ${ELEVENLABS_API_KEY:}
    base-url: https://api.elevenlabs.io
    # Tiếng Việt không có trong eleven_multilingual_v2; flash/v3 mới hỗ trợ vi
    model-id: ${TTS_MODEL_ID:eleven_flash_v2_5}
    # Một voice dùng chung cho mọi ngôn ngữ (voice ElevenLabs không gắn ngôn ngữ).
    # BẮT BUỘC điền voice ID thuộc tài khoản (Voices -> Voice Design, free tier 3 slot);
    # voice thư viện như Rachel bị free tier chặn qua API (lỗi 402 paid_plan_required).
    voice-id: ${TTS_VOICE:Zt0RvThLQEeXvt7v82wV}
  mt:
    # DeepL Free: 500.000 ký tự/tháng, không cần thẻ. Để trống thì endpoint thêm ngôn ngữ trả 503.
    api-key: ${DEEPL_API_KEY:}
    base-url: ${DEEPL_BASE_URL:https://api-free.deepl.com}
  languages:
    # Admin được thêm những ngôn ngữ này: giao của eleven_flash_v2_5 (32 ngôn ngữ) và DeepL.
    # vi là ngôn ngữ nguồn nên không nằm trong danh sách. Kiểm tra lại khi đổi TTS_MODEL_ID hoặc nhà cung cấp dịch.
    supported:
      - { code: ar, name: العربية }
      - { code: bg, name: Български }
      - { code: cs, name: Čeština }
      - { code: da, name: Dansk }
      - { code: de, name: Deutsch }
      - { code: el, name: Ελληνικά }
      - { code: en, name: English }
      - { code: es, name: Español }
      - { code: fi, name: Suomi }
      - { code: fr, name: Français }
      - { code: hu, name: Magyar }
      - { code: id, name: Indonesia }
      - { code: it, name: Italiano }
      - { code: ja, name: 日本語 }
      - { code: ko, name: 한국어 }
      - { code: nl, name: Nederlands }
      - { code: pl, name: Polski }
      - { code: pt, name: Português }
      - { code: ro, name: Română }
      - { code: ru, name: Русский }
      - { code: sk, name: Slovenčina }
      - { code: sv, name: Svenska }
      - { code: tr, name: Türkçe }
      - { code: uk, name: Українська }
      - { code: zh, name: 中文 }

