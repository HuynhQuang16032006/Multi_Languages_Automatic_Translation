name: Backend 3-Tier CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    name: Build, Test & Package (Java 21)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: audiotour_db
        ports:
          - 33316:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    steps:
    - name: Checkout source code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven

    - name: Grant execute permission for mvnw
      run: chmod +x mvnw

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'
        cache: npm
        cache-dependency-path: frontend/package-lock.json

    - name: Test and build frontend
      working-directory: frontend
      run: |
        npm ci
        npm test

    - name: Prepare isolated test databases
      env:
        MYSQL_PWD: root
      run: |
        mysql -h 127.0.0.1 -P 33316 -u root <<'SQL'
        CREATE DATABASE audiotour_test;
        CREATE DATABASE audiotour_prod_profile_test;
        CREATE USER 'audiotour_test'@'%' IDENTIFIED BY 'ci-test-only-password';
        GRANT ALL PRIVILEGES ON `audiotour\_test`.* TO 'audiotour_test'@'%';
        GRANT ALL PRIVILEGES ON `audiotour\_prod\_profile\_test`.* TO 'audiotour_test'@'%';
        SQL

    - name: Run Maven Tests and Verify
      env:
        AUDIOTOUR_TEST_DB_PASSWORD: ci-test-only-password
        JWT_SECRET: ci-only-secret-key-must-be-at-least-32-bytes-long
        APP_ADMIN_USERNAME: admin
        APP_ADMIN_PASSWORD: admin123
      run: ./mvnw clean verify

    - name: Upload Build Artifact (JAR)
      uses: actions/upload-artifact@v4
      with:
        name: audiotour-backend-jar
        path: target/*.jar

  docker-build-push:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    needs: build-and-test
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set lowercase image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.IMAGE }}:latest
